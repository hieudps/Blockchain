<!DOCTYPE html>
<html>
<head>
    <title>Mini Ethereum Simulation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    Mini Ethereum Blockchain - RYZE COIN
</header>

<div class="container">

    <div class="card">
        <h3>Check Balance</h3>
        <input id="address" placeholder="Address">
        <button onclick="checkBalance()">Check</button>
        <p id="balanceResult"></p>
    </div>

    <div class="card">
        <h3>Transfer Token</h3>
        <input id="sender" placeholder="Sender">
        <input id="receiver" placeholder="Receiver">
        <input id="amount" type="number" placeholder="Amount">
        <button onclick="transfer()">Send</button>
        <p id="transferResult"></p>
    </div>

    <div class="card">
        <h3>Mine Block</h3>
        <button onclick="mine()">Mine</button>
        <p id="mineResult"></p>
    </div>

    <div class="card">
        <h3>Blockchain</h3>
        <button onclick="loadChain()">Refresh</button>
        <pre id="chain"></pre>
    </div>

</div>

<script>
async function checkBalance() {
    const address = document.getElementById("address").value;
    const res = await fetch(`/balance/${address}`);
    const data = await res.json();
    document.getElementById("balanceResult").innerText =
        `${data.address}: ${data.balance}`;
}

async function transfer() {
    const sender = document.getElementById("sender").value;
    const receiver = document.getElementById("receiver").value;
    const amount = parseInt(document.getElementById("amount").value);

    const res = await fetch('/transfer', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ sender, receiver, amount })
    });

    const data = await res.json();
    document.getElementById("transferResult").innerText = data.message;
}

async function mine() {
    const res = await fetch('/mine');
    const data = await res.json();
    document.getElementById("mineResult").innerText =
        data.hash ? "Block mined successfully" : data.message;
}

async function loadChain() {
    const res = await fetch('/chain');
    const data = await res.json();
    document.getElementById("chain").innerText =
        JSON.stringify(data, null, 2);
}

loadChain();
</script>

</body>
</html>
